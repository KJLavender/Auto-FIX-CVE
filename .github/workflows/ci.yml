name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  action:
    # Dogfood the composite action on the intentionally vulnerable fixture.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: ./
        with:
          path: test/fixtures/vuln-app
          fail-on: none
          upload-sarif: "false"
      - name: SARIF points at the vulnerable call site
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("autofix-cve.sarif", "utf8"));
            const uris = s.runs[0].results.map(r => r.locations[0].physicalLocation.artifactLocation.uri);
            if (!uris.includes("test/fixtures/vuln-app/src/render.ts")) { console.error(uris); process.exit(1); }
            console.log(s.runs[0].results.length + " results");
          '

  e2e:
    # Real fix run against npm and OSV, limited to semver-compatible upgrades so no model is needed.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm ci && npm run build
      - name: Fix the vulnerable fixture
        run: |
          D="$RUNNER_TEMP/app"
          cp -r test/fixtures/vuln-app "$D"
          cd "$D"
          npm install --ignore-scripts --no-audit --no-fund
          git init -q && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm base
          node "$GITHUB_WORKSPACE/dist/cli.js" fix . --only lodash minimist --yes
      - name: Rescan shows lodash and minimist fixed, axios untouched
        run: |
          node dist/cli.js scan "$RUNNER_TEMP/app" --json > scan.json || true
          node -e '
            const names = JSON.parse(require("fs").readFileSync("scan.json", "utf8")).map(f => f.dependency.name);
            if (names.includes("lodash") || names.includes("minimist")) { console.error("still vulnerable:", names); process.exit(1); }
            if (!names.includes("axios")) { console.error("axios should not have been touched:", names); process.exit(1); }
            console.log("remaining:", names);
          '

  e2e-go:
    # Real fix run on a Go module: semver-compatible upgrades, verified with go build and go test.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: npm ci && npm run build
      - name: Fix the Go fixture
        run: |
          D="$RUNNER_TEMP/goapp"
          cp -r test/fixtures/go-app "$D"
          cd "$D"
          go mod tidy
          git init -q && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm base
          node "$GITHUB_WORKSPACE/dist/cli.js" fix . --only gopkg.in/yaml.v2 github.com/gin-gonic/gin --yes
          go build ./...
      - name: Rescan shows yaml.v2 and gin fixed
        run: |
          node dist/cli.js scan "$RUNNER_TEMP/goapp" --json > scan.json || true
          node -e '
            const names = JSON.parse(require("fs").readFileSync("scan.json", "utf8")).map(f => f.dependency.name);
            const left = names.filter(n => n === "gopkg.in/yaml.v2" || n === "github.com/gin-gonic/gin");
            if (left.length) { console.error("still vulnerable:", left); process.exit(1); }
            console.log("remaining:", names);
          '
