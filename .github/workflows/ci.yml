name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  action:
    # Dogfood the composite action on the intentionally vulnerable fixture.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: ./
        with:
          path: test/fixtures/vuln-app
          fail-on: none
          upload-sarif: "false"
      - name: SARIF points at the vulnerable call site
        run: |
          node -e '
            const s = JSON.parse(require("fs").readFileSync("autofix-cve.sarif", "utf8"));
            const uris = s.runs[0].results.map(r => r.locations[0].physicalLocation.artifactLocation.uri);
            if (!uris.includes("test/fixtures/vuln-app/src/render.ts")) { console.error(uris); process.exit(1); }
            console.log(s.runs[0].results.length + " results");
          '
